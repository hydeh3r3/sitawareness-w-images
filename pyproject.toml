[project]
name = "visual-elicitation-under-pressure"
version = "0.1.0"
description = "A local, auditable pilot of visual evidence and reporting failures"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3", "pillow>=11,<13", "httpx>=0.28,<1", "numpy>=2,<3", "scikit-learn>=1.6,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
veup = "veup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veup"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
